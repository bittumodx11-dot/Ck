<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Inner card frame -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="48" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Stylized S and Document icon -->
    <path d="M 190 190 Q 256 160 322 190 Q 322 250 256 256 Q 190 262 190 322 Q 256 352 322 322" 
          fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="340" cy="180" r="16" fill="#FBBF24" />
  </g>
</svg>
